<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🐜 蚁后桌宠</title>
    <style>
        /* 全局重置 & 全屏 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #ffffff;
            font-family: 'Segoe UI', 'PingFang SC', Roboto, 'Helvetica Neue', sans-serif;
            user-select: none;
        }

        /* ========== 加载遮罩 ========== */
        #loadingOverlay {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            transition: opacity 0.7s ease, visibility 0.7s ease;
            opacity: 1;
            visibility: visible;
        }
        #loadingOverlay.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .loading-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            padding: 20px 32px;
            max-width: 300px;
            width: 100%;
        }

        .loading-icon {
            font-size: 48px;
            animation: bounceAnt 1.2s ease-in-out infinite;
        }
        @keyframes bounceAnt {
            0%,
            100% {
                transform: translateY(0) scale(1);
            }
            50% {
                transform: translateY(-10px) scale(1.06);
            }
        }

        .loading-title {
            font-size: 15px;
            font-weight: 500;
            color: #8888a0;
            letter-spacing: 0.3px;
        }

        .progress-track {
            width: 100%;
            height: 5px;
            background: #f0edf8;
            border-radius: 20px;
            overflow: hidden;
            position: relative;
        }

        .progress-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #7c5cfc, #a78bfa);
            border-radius: 20px;
            transition: width 0.3s cubic-bezier(0.34, 1.2, 0.64, 1);
        }

        .progress-text {
            font-size: 18px;
            font-weight: 600;
            color: #2d2d3f;
            font-variant-numeric: tabular-nums;
            min-width: 54px;
            text-align: center;
        }

        .loading-sub {
            font-size: 12px;
            color: #b8b8d0;
            margin-top: -2px;
        }

        /* ========== 主容器 ========== */
        .app {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: #ffffff;
            position: relative;
            overflow: hidden;
            opacity: 0;
            transition: opacity 0.6s ease;
        }
        .app.show {
            opacity: 1;
        }

        /* -------- 头部（标题 + 关闭按钮 + 权限按钮） -------- */
        .header {
            display: flex;
            justify-content: flex-start;
            align-items: center;
            padding: 62px 24px 2px 24px;
            flex-shrink: 0;
            background: #ffffff;
            z-index: 10;
            border-bottom: 1px solid #f2f2f8;
            position: relative;
            gap: 12px;
        }

        .title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 20px;
            font-weight: 600;
            color: #2d2d3f;
        }
        .title .emoji {
            font-size: 26px;
        }
        .title .badge {
            background: #0d47a1;
            color: #bbdefb;
            font-size: 10px;
            font-weight: 500;
            padding: 8px 10px;
            border-radius: 20px;
            margin-left: 4px;
        }

        .header-actions {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* 权限按钮 */
        .permission-wrapper {
            position: relative;
            z-index: 20;
        }
        .permission-btn {
            background: #f5f5fa;
            border: none;
            border-radius: 40px;
            padding: 8px 18px 8px 16px;
            font-size: 14px;
            font-weight: 500;
            color: #3d3d50;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            transition: background 0.2s, transform 0.15s;
        }
        .permission-btn:hover {
            background: #eeedf5;
        }
        .permission-btn:active {
            transform: scale(0.96);
        }
        .permission-btn .icon {
            font-size: 18px;
        }
        .permission-btn .arrow {
            font-size: 12px;
            transition: transform 0.25s ease;
            margin-left: 2px;
        }
        .permission-btn .arrow.open {
            transform: rotate(180deg);
        }

        /* 红色关闭按钮 */
        .permission-btn.close-btn {
            background: #e63946;
            color: #ffffff;
            border: none;
        }
        .permission-btn.close-btn:hover {
            background: #d32f2f;
        }
        .permission-btn.close-btn:active {
            background: #b71c1c;
            transform: scale(0.96);
        }

        /* 灰色退出网页按钮 */
        .permission-btn.exit-btn {
            background: #6c757d;
            color: #ffffff;
            border: none;
        }
        .permission-btn.exit-btn:hover {
            background: #5a6268;
        }
        .permission-btn.exit-btn:active {
            background: #495057;
            transform: scale(0.96);
        }

        /* 权限下拉面板 */
        .permission-dropdown {
            position: absolute;
            top: calc(100% + 10px);
            right: 0;
            background: #ffffff;
            border-radius: 20px;
            min-width: 240px;
            padding: 8px 0;
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.10), 0 4px 14px rgba(0, 0, 0, 0.04);
            opacity: 0;
            visibility: hidden;
            transform: translateY(-6px) scale(0.96);
            transform-origin: top right;
            transition: opacity 0.25s ease, transform 0.25s ease, visibility 0.25s;
            border: 1px solid rgba(0, 0, 0, 0.02);
            max-height: 420px;
            overflow-y: auto;
            width: 280px;
        }
        .permission-dropdown.open {
            opacity: 1;
            visibility: visible;
            transform: translateY(0) scale(1);
        }
        .permission-dropdown .dropdown-header {
            padding: 14px 22px 8px 22px;
            font-size: 13px;
            font-weight: 600;
            color: #8888a0;
            letter-spacing: 0.5px;
            border-bottom: 1px solid #f2f2f8;
            margin-bottom: 4px;
        }
        .permission-dropdown .item {
            padding: 12px 22px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: background 0.15s;
            font-size: 15px;
            color: #2d2d3f;
            font-weight: 450;
            border: none;
            background: transparent;
            width: 100%;
            text-align: left;
        }
        .permission-dropdown .item:hover {
            background: #f7f6fc;
        }
        .permission-dropdown .item:active {
            background: #eeecf5;
        }
        .permission-dropdown .item .icon {
            font-size: 20px;
            width: 28px;
            text-align: center;
            flex-shrink: 0;
        }
        .permission-dropdown .item .label {
            flex: 1;
        }
        .permission-dropdown .dropdown-footer {
            padding: 10px 22px 14px 22px;
            font-size: 12px;
            color: #b0b0c8;
            border-top: 1px solid #f2f2f8;
            margin-top: 4px;
            text-align: center;
        }

        /* -------- iframe 容器（替代原视频区域） -------- */
        .iframe-wrapper {
            flex: 1;
            min-height: 0;
            background: #fafaff;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .iframe-wrapper iframe {
            width: 100%;
            height: 100%;
            display: block;
            border: none;
            background: #f8f8fe;
            position: relative;
            z-index: 1;
        }

        /* -------- 作者按钮（右下角） -------- */
        .author-wrapper {
            position: fixed;
            bottom: 62px;
            right: 30px;
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }
        .author-btn {
            border: none;
            background: #ffffff;
            padding: 0;
            cursor: pointer;
            border-radius: 50%;
            overflow: hidden;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
            transition: transform 0.25s ease, box-shadow 0.25s ease;
            width: 70px;
            height: 70px;
            border: 2px solid #ffffff;
            outline: 1px solid rgba(0, 0, 0, 0.04);
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f5f5fa;
            font-size: 14px;
            font-weight: 600;
            color: #3d3d50;
            flex-direction: column;
            position: relative;
            z-index: 101;
        }
        .author-btn:hover {
            transform: scale(1.06);
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.12);
        }
        .author-btn:active {
            transform: scale(0.92);
        }
        .author-btn img {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
            border-radius: 50%;
        }
        .author-btn .author-text {
            position: absolute;
            bottom: 2px;
            background: rgba(255, 255, 255, 0.85);
            padding: 0 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            color: #2d2d3f;
            backdrop-filter: blur(4px);
            line-height: 1.6;
            white-space: nowrap;
            border: 1px solid rgba(0, 0, 0, 0.04);
        }
        .author-btn .fallback-text {
            display: none;
            font-size: 28px;
        }
        .author-btn img.error+.fallback-text {
            display: block;
        }
        .author-btn img.error {
            display: none;
        }

        /* -------- 模态框 -------- */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(6px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 999;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
            padding: 20px;
        }
        .modal-overlay.open {
            opacity: 1;
            visibility: visible;
        }
        .modal-box {
            background: #ffffff;
            border-radius: 32px;
            max-width: 400px;
            width: 100%;
            padding: 32px 28px 28px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.20);
            transform: scale(0.92) translateY(20px);
            transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s;
            opacity: 0;
            text-align: center;
        }
        .modal-overlay.open .modal-box {
            transform: scale(1) translateY(0);
            opacity: 1;
        }
        .modal-box .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            margin: 0 auto 16px;
            display: block;
            border: 3px solid #f0edff;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
        }
        .modal-box h2 {
            font-size: 22px;
            font-weight: 600;
            color: #2d2d3f;
            margin-bottom: 6px;
        }
        .modal-box .sub {
            font-size: 14px;
            color: #8888a0;
            margin-bottom: 16px;
        }
        .modal-box .desc {
            font-size: 15px;
            color: #3d3d50;
            line-height: 1.6;
            margin-bottom: 24px;
        }
        .modal-box .close-btn {
            background: #f5f5fa;
            border: none;
            padding: 10px 32px;
            border-radius: 40px;
            font-size: 15px;
            font-weight: 500;
            color: #3d3d50;
            cursor: pointer;
            transition: background 0.2s;
        }
        .modal-box .close-btn:hover {
            background: #eeedf5;
        }

        /* -------- Toast -------- */
        .toast {
            position: fixed;
            top: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(-20px);
            background: #2d2d3f;
            color: #ffffff;
            padding: 12px 28px;
            border-radius: 40px;
            font-size: 14px;
            font-weight: 450;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.12);
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, transform 0.3s ease, visibility 0.3s;
            z-index: 9999;
            display: flex;
            align-items: center;
            gap: 10px;
            pointer-events: none;
            max-width: 90vw;
        }
        .toast.show {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(0);
        }
        .toast .emoji {
            font-size: 18px;
        }

        /* -------- 响应式 -------- */
        @media (max-width: 600px) {
            .header {
                padding: 54px 16px 1px 16px;
                gap: 8px;
            }
            .title {
                font-size: 17px;
            }
            .title .emoji {
                font-size: 22px;
            }
            .permission-btn {
                font-size: 12px;
                padding: 6px 14px 6px 12px;
            }
            .permission-btn .icon {
                font-size: 16px;
            }
            .permission-dropdown {
                min-width: 200px;
                right: -8px;
            }
            .permission-dropdown .item {
                padding: 10px 16px;
                font-size: 14px;
            }
            .author-wrapper {
                bottom: 62px;
                right: 20px;
            }
            .author-btn {
                width: 60px;
                height: 60px;
            }
            .author-btn .author-text {
                font-size: 11px;
                padding: 0 8px;
            }
            .modal-box {
                padding: 24px 20px 20px;
            }
            .modal-box .avatar {
                width: 80px;
                height: 80px;
            }
            .header-actions {
                gap: 6px;
            }
        }
        @media (max-width: 400px) {
            .header {
                padding: 44px 12px 0px 12px;
            }
            .title {
                font-size: 15px;
            }
            .permission-btn {
                font-size: 11px;
                padding: 4px 10px;
            }
            .author-btn {
                width: 52px;
                height: 52px;
            }
            .author-wrapper {
                bottom: 62px;
                right: 14px;
            }
            .header-actions {
                gap: 4px;
            }
        }
    </style>
</head>
<body>

    <!-- ========== 加载遮罩 ========== -->
    <div id="loadingOverlay">
        <div class="loading-box">
            <div class="loading-icon">🐜</div>
            <div class="loading-title">蚁后桌宠 · 加载中</div>
            <div class="progress-track">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="progress-text" id="progressText">0%</div>
            <div class="loading-sub" id="loadingStatus">准备资源…</div>
        </div>
    </div>

    <!-- ========== Toast ========== -->
    <div class="toast" id="toast">
        <span class="emoji">✨</span>
        <span class="msg" id="toastMsg">提示</span>
    </div>

    <!-- ========== 主应用 ========== -->
    <div class="app" id="app">

        <!-- 头部 -->
        <div class="header">
            <div class="title">
                <span class="emoji">🐜</span>
                <span class="ants"></span>
                <span class="badge">蚁后桌宠</span>
            </div>
            <div class="header-actions">
                <!-- 退出网页按钮 -->
                <button class="permission-btn exit-btn" id="exitPageBtn">
                    <span class="icon">✕</span>
                    退出
                </button>
                <!-- 红色关闭按钮 -->
                <button class="permission-btn close-btn" id="closePetBtn">
                    <span class="icon">✕</span>
                    关闭
                </button>
                <!-- 权限按钮 -->
                <div class="permission-wrapper">
                    <button class="permission-btn" id="permBtn">
                        <span class="icon">⚙️</span>
                        权限
                        <span class="arrow" id="permArrow">▾</span>
                    </button>
                    <div class="permission-dropdown" id="permDropdown">
                        <div class="dropdown-header">📋 应用所需权限</div>
                        <button class="item" data-perm="overlay">
                            <span class="icon">🪟</span>
                            <span class="label">1. 打开悬浮窗权限</span>
                        </button>
                        <button class="item" data-perm="notification">
                            <span class="icon">🔔</span>
                            <span class="label">2. 打开通知权限</span>
                        </button>
                        <div class="dropdown-footer">
                            1.在系统设置中开启以上权限即可获得桌宠，如果出现点击给权限直接闪退回应用的现象，请手动到系统设置开启。<br>
                            2.可长按通知点击结束APP、点击关闭按钮或删除后台关闭桌宠。<br>
                            ⚠︎注:关闭是关闭应用，退出是退出网页，此权限只适用于应用端，网页端无法召唤桌宠
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- ===== iframe 区域（替代原视频+封面） ===== -->
        <div class="iframe-wrapper" id="iframeWrapper">
            <iframe id="contentFrame" src="2.html" loading="lazy"></iframe>
        </div>

        <!-- ===== 控制栏已移除（原暂停/开启按钮及时间显示均删除） ===== -->

    </div>

    <!-- 作者按钮（右下角） -->
    <div class="author-wrapper">
        <button class="author-btn" id="authorBtn">
            <img src="1.png" alt="作者头像" id="authorImg">
            <span class="author-text">作者</span>
            <span class="fallback-text">🐜</span>
        </button>
    </div>

    <!-- 作者详情弹窗 -->
    <div class="modal-overlay" id="authorModal">
        <div class="modal-box">
            <img src="1.png" alt="作者头像" class="avatar" id="modalAvatar">
            <h2>Ants</h2>
            <div class="sub">感谢游玩!</div>
            <div class="desc">
                我是养蚁人Ants，<br>祝大家养蚁爆产。
            </div>
            <button class="close-btn" id="closeModalBtn">关 闭</button>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            // -------- DOM --------
            const overlay = document.getElementById('loadingOverlay');
            const progressFill = document.getElementById('progressFill');
            const progressText = document.getElementById('progressText');
            const loadingStatus = document.getElementById('loadingStatus');
            const app = document.getElementById('app');

            const iframe = document.getElementById('contentFrame');

            const permBtn = document.getElementById('permBtn');
            const permDropdown = document.getElementById('permDropdown');
            const permArrow = document.getElementById('permArrow');

            const closePetBtn = document.getElementById('closePetBtn');
            const exitPageBtn = document.getElementById('exitPageBtn');

            const authorBtn = document.getElementById('authorBtn');
            const authorModal = document.getElementById('authorModal');
            const closeModalBtn = document.getElementById('closeModalBtn');
            const modalAvatar = document.getElementById('modalAvatar');
            const authorImg = document.getElementById('authorImg');

            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMsg');

            let toastTimer = null;
            let loadCompleted = false;

            // -------- Toast --------
            function showToast(msg, emoji = '✨') {
                toastMsg.textContent = msg;
                toast.querySelector('.emoji').textContent = emoji;
                toast.classList.add('show');
                clearTimeout(toastTimer);
                toastTimer = setTimeout(() => {
                    toast.classList.remove('show');
                }, 2800);
            }

            // -------- 退出网页 --------
            exitPageBtn.addEventListener('click', () => {
                if (window.close) {
                    try {
                        window.close();
                    } catch (e) {
                        if (window.history.length > 1) {
                            window.history.back();
                        } else {
                            showToast('当前页面无法关闭，请手动退出', '⚠️');
                        }
                    }
                } else if (window.history.length > 1) {
                    window.history.back();
                } else {
                    showToast('当前页面无法关闭，请手动退出', '⚠️');
                }
            });

            // -------- 关闭桌宠 --------
            closePetBtn.addEventListener('click', () => {
                if (window.Android && typeof window.Android.closePet === 'function') {
                    try {
                        window.Android.closePet();
                        showToast('正在关闭桌宠…', '🐜');
                    } catch (e) {
                        showToast('关闭失败，请检查权限或通知栏', '⚠️');
                    }
                } else {
                    showToast('请使用桌宠应用或授予权限后关闭', '🐜');
                }
            });

            // -------- 加载模拟（进度条） --------
            let progress = 0;
            const progressInterval = setInterval(() => {
                if (loadCompleted) {
                    clearInterval(progressInterval);
                    return;
                }
                // 每次增加 1~3，直至 95%
                const step = 1 + Math.floor(Math.random() * 3);
                progress = Math.min(95, progress + step);
                progressFill.style.width = progress + '%';
                progressText.textContent = progress + '%';

                if (progress < 30) loadingStatus.textContent = '正在加载资源…';
                else if (progress < 60) loadingStatus.textContent = '即将就绪…';
                else if (progress < 95) loadingStatus.textContent = '马上就好…';
                else loadingStatus.textContent = '加载中…';
            }, 200);

            // -------- 监听 iframe 加载完成 --------
            function onIframeLoaded() {
                if (loadCompleted) return;
                loadCompleted = true;
                clearInterval(progressInterval);
                progressFill.style.width = '100%';
                progressText.textContent = '100%';
                loadingStatus.textContent = '加载完成 ✨';

                setTimeout(() => {
                    overlay.classList.add('hidden');
                    app.classList.add('show');
                }, 350);
            }

            // iframe 加载成功
            iframe.addEventListener('load', onIframeLoaded);

            // iframe 加载出错时也尝试继续（防止卡死）
            iframe.addEventListener('error', () => {
                console.warn('iframe 加载失败，强制继续');
                if (!loadCompleted) {
                    loadingStatus.textContent = '加载完成 ✨';
                    setTimeout(() => {
                        overlay.classList.add('hidden');
                        app.classList.add('show');
                    }, 300);
                }
            });

            // -------- 超时保护：最多等待 8 秒 --------
            setTimeout(() => {
                if (!loadCompleted) {
                    console.warn('加载超时，强制显示页面');
                    loadCompleted = true;
                    clearInterval(progressInterval);
                    progressFill.style.width = '100%';
                    progressText.textContent = '100%';
                    loadingStatus.textContent = '加载完成 ✨';
                    setTimeout(() => {
                        overlay.classList.add('hidden');
                        app.classList.add('show');
                    }, 300);
                }
            }, 8000);

            // -------- 权限下拉 --------
            permBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                const isOpen = permDropdown.classList.contains('open');
                if (isOpen) {
                    permDropdown.classList.remove('open');
                    permArrow.classList.remove('open');
                } else {
                    permDropdown.classList.add('open');
                    permArrow.classList.add('open');
                }
            });

            document.addEventListener('click', (e) => {
                if (!permBtn.contains(e.target) && !permDropdown.contains(e.target)) {
                    permDropdown.classList.remove('open');
                    permArrow.classList.remove('open');
                }
            });

            document.querySelectorAll('.permission-dropdown .item').forEach(item => {
                item.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const perm = item.dataset.perm;
                    if (perm === 'overlay') {
                        showToast('请前往系统设置开启「悬浮窗权限」', '🪟');
                    } else if (perm === 'notification') {
                        showToast('请前往系统设置开启「通知权限」', '🔔');
                    }
                    permDropdown.classList.remove('open');
                    permArrow.classList.remove('open');
                });
            });

            // -------- 作者按钮 & 模态框 --------
            authorBtn.addEventListener('click', () => {
                authorModal.classList.add('open');
            });

            function closeModal() {
                authorModal.classList.remove('open');
            }

            closeModalBtn.addEventListener('click', closeModal);
            authorModal.addEventListener('click', (e) => {
                if (e.target === authorModal) closeModal();
            });

            authorImg.addEventListener('error', () => {
                authorImg.classList.add('error');
                modalAvatar.src =
                    'data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"%3E%3Ctext y=".9em" font-size="90"%3E🐜%3C/text%3E%3C/svg%3E';
            });
            modalAvatar.addEventListener('error', () => {
                modalAvatar.src =
                    'data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"%3E%3Ctext y=".9em" font-size="90"%3E🐜%3C/text%3E%3C/svg%3E';
            });

            // -------- 键盘快捷键：ESC 关闭弹窗 --------
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    if (authorModal.classList.contains('open')) closeModal();
                }
            });

            console.log('🐜 蚁后桌宠 · iframe 版已启动（已移除视频及控制按钮）');
        })();
    </script>

</body>
</html>
