<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>昆虫对决 · 自定义版</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-touch-callout: none; }
        body {
            font-family: "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #8B4513 0%, #A0522D 50%, #CD853F 100%);
            min-height: 100vh;
            overflow: hidden;
            position: relative;
            touch-action: none;
        }
        #loadingScreen {
            position: fixed; inset: 0;
            background: #2d1b0e;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            z-index: 9999;
            transition: opacity 0.8s;
            color: #FFF8DC;
            font-size: 1.5em;
        }
        #loadingScreen.hidden { opacity: 0; pointer-events: none; }
        .loader {
            width: 80px; height: 80px;
            border: 8px solid rgba(255,248,220,0.2);
            border-top: 8px solid #FFD700;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 30px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .loading-text { letter-spacing: 4px; text-shadow: 0 0 20px rgba(255,215,0,0.3); }

        /* 标题区域 + 加号按钮 */
        .header-area {
            position: fixed; top: 14px; left: 0; right: 0;
            display: flex; align-items: center; justify-content: center;
            z-index: 100; pointer-events: none;
            padding: 0 16px;
        }
        .title {
            color: #FFF8DC; font-size: 1.7em; text-shadow: 2px 2px 8px rgba(0,0,0,0.7);
            letter-spacing: 2px; pointer-events: none;
        }
        .title small { font-size: 0.5em; opacity: 0.8; }
        .add-btn {
            position: absolute; left: 16px; top: 50%; transform: translateY(-50%);
            width: 40px; height: 40px;
            border-radius: 50%;
            border: 2px solid rgba(255,248,220,0.6);
            background: rgba(255,248,220,0.2);
            color: #FFF8DC;
            font-size: 28px;
            font-weight: 300;
            cursor: pointer;
            pointer-events: auto;
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
            box-shadow: 0 2px 12px rgba(0,0,0,0.3);
            z-index: 110;
        }
        .add-btn:hover { background: rgba(255,248,220,0.4); transform: translateY(-50%) scale(1.1); }
        .add-btn:active { transform: translateY(-50%) scale(0.9); }
        .add-btn.disabled { opacity: 0.4; pointer-events: none; }

        #stopControlBtn {
            position: fixed; top: 70px; left: 16px;
            z-index: 250;
            background: rgba(255,50,50,0.85);
            color: #fff;
            border: 2px solid #ff8888;
            border-radius: 30px;
            padding: 6px 16px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            backdrop-filter: blur(4px);
            box-shadow: 0 2px 12px rgba(255,0,0,0.4);
            display: none;
            transition: 0.2s;
            pointer-events: auto;
        }
        #stopControlBtn:hover { background: rgba(255,0,0,0.9); transform: scale(1.05); }
        #stopControlBtn:active { transform: scale(0.92); }

        .settings-btn,
        .list-btn {
            position: fixed;
            top: 16px;
            width: 44px; height: 44px;
            background: rgba(255,248,220,0.25); border: 2px solid rgba(255,248,220,0.5);
            border-radius: 50%; color: #FFF8DC; font-size: 20px;
            cursor: pointer; z-index: 200;
            display: flex; align-items: center; justify-content: center;
            transition: 0.3s; backdrop-filter: blur(4px);
            box-shadow: 0 2px 12px rgba(0,0,0,0.3);
        }
        .settings-btn { right: 18px; }
        .list-btn { right: 70px; }
        .settings-btn:hover, .list-btn:hover { background: rgba(255,248,220,0.4); transform: rotate(60deg); }
        .settings-btn:active, .list-btn:active { transform: scale(0.9) rotate(60deg); }

        .insect {
            position: absolute; cursor: pointer; z-index: 10;
            transition: filter 0.3s, opacity 0.3s; touch-action: none;
        }
        .insect img {
            width: 100%; height: 100%; object-fit: contain;
            filter: drop-shadow(2px 2px 6px rgba(0,0,0,0.4));
            pointer-events: none; transition: filter 0.3s;
        }
        .insect .name-tag {
            position: absolute; top: -28px; left: 50%; transform: translateX(-50%);
            background: rgba(255,255,255,0.92); color: #5D4037;
            padding: 2px 12px; border-radius: 12px; font-size: 12px; font-weight: bold;
            white-space: nowrap; box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 20;
        }
        .insect:hover .name-tag { opacity: 1; }
        .hp-bar-wrap {
            position: absolute; bottom: -12px; left: 50%; transform: translateX(-50%);
            width: 70%; height: 6px; background: rgba(0,0,0,0.5);
            border-radius: 3px; overflow: hidden; box-shadow: inset 0 1px 3px rgba(0,0,0,0.3);
            pointer-events: none; z-index: 15;
        }
        .hp-bar-fill {
            height: 100%; width: 100%; border-radius: 3px;
            transition: width 0.3s ease;
            background: linear-gradient(90deg, #4CAF50, #8BC34A);
        }
        .hp-bar-fill.low { background: linear-gradient(90deg, #f44336, #FF5722); }
        .hp-bar-fill.mid { background: linear-gradient(90deg, #FF9800, #FFC107); }

        .insect.selected { z-index: 25; }
        .insect.selected::after {
            content: ''; position: absolute; inset: -8px;
            border: 3px solid #FFD700; border-radius: 50%;
            box-shadow: 0 0 20px rgba(255,215,0,0.6), inset 0 0 20px rgba(255,215,0,0.2);
            animation: pulse-gold 1s ease-in-out infinite; pointer-events: none;
        }
        @keyframes pulse-gold { 0%,100% { transform: scale(1); opacity: 0.8; } 50% { transform: scale(1.05); opacity: 1; } }

        .insect.dead {
            filter: grayscale(1) brightness(0.6); cursor: default; opacity: 0.5;
        }
        .insect.dead .name-tag { opacity: 0.6 !important; background: rgba(100,100,100,0.9); color: #ddd; }
        .insect.dead .hp-bar-fill { background: #666 !important; }
        .insect.dead .dead-badge { display: block !important; }
        .dead-badge {
            display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
            color: #ff3333; font-size: 18px; font-weight: bold;
            text-shadow: 0 0 12px rgba(255,0,0,0.8), 0 0 24px rgba(255,0,0,0.4);
            pointer-events: none; z-index: 30;
            background: rgba(0,0,0,0.5); padding: 4px 12px; border-radius: 8px;
            border: 2px solid #ff3333;
        }
        .revive-timer {
            position: absolute; bottom: -28px; left: 50%; transform: translateX(-50%);
            color: #ffcc02; font-size: 12px; font-weight: 700;
            text-shadow: 0 0 10px rgba(255,204,2,0.5);
            pointer-events: none; z-index: 16;
            background: rgba(0,0,0,0.5); padding: 1px 8px; border-radius: 8px;
            opacity: 0; transition: opacity 0.3s; white-space: nowrap;
        }
        .insect.dead .revive-timer { opacity: 1; }

        .insect.hit { animation: hit-shake 0.4s ease; }
        @keyframes hit-shake {
            0%,100% { transform: translateX(0) rotate(0deg); }
            20% { transform: translateX(-8px) rotate(-5deg); }
            40% { transform: translateX(8px) rotate(5deg); }
            60% { transform: translateX(-5px) rotate(-3deg); }
            80% { transform: translateX(5px) rotate(3deg); }
        }
        .insect.hit img { filter: drop-shadow(0 0 20px rgba(255,0,0,0.8)) brightness(1.3); }
        .insect.attacking img { animation: attack-flash 0.3s ease 2; }
        @keyframes attack-flash {
            0%,100% { filter: drop-shadow(0 0 8px rgba(255,215,0,0.6)) brightness(1); }
            50% { filter: drop-shadow(0 0 30px rgba(255,215,0,1)) brightness(1.6); }
        }
        .insect.revive { animation: revive-pop 0.8s ease; }
        @keyframes revive-pop {
            0% { transform: scale(0.2); opacity: 0; filter: brightness(2) hue-rotate(90deg); }
            50% { transform: scale(1.3); opacity: 1; filter: brightness(1.5) hue-rotate(0deg); }
            70% { transform: scale(0.9); }
            100% { transform: scale(1); opacity: 1; filter: brightness(1) hue-rotate(0deg); }
        }

        .click-effect {
            position: absolute; width: 100px; height: 100px;
            border: 3px solid #FFD700; border-radius: 50%;
            pointer-events: none; z-index: 5;
            animation: ripple 0.6s ease-out forwards;
        }
        @keyframes ripple { 0% { transform: scale(0.3); opacity: 1; } 100% { transform: scale(2.5); opacity: 0; } }

        .dmg-float {
            position: absolute; font-size: 28px; font-weight: 900;
            color: #ff1744; text-shadow: 0 0 10px rgba(255,23,68,0.8), 0 2px 8px rgba(0,0,0,0.5);
            pointer-events: none; z-index: 50;
            animation: float-up 1s ease-out forwards;
        }
        @keyframes float-up { 0% { opacity: 1; transform: translateY(0) scale(1); } 100% { opacity: 0; transform: translateY(-80px) scale(1.4); } }

        .projectile {
            position: absolute; width: 20px; height: 20px;
            border-radius: 50%; background: radial-gradient(#7fff00, #00aa00);
            box-shadow: 0 0 20px #7fff00; pointer-events: none; z-index: 40;
            transition: none;
        }
        .projectile.poison { background: radial-gradient(#ab47bc, #4a148c); box-shadow: 0 0 25px #ab47bc; }

        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.6);
            backdrop-filter: blur(6px); z-index: 500;
            display: none; align-items: center; justify-content: center;
            animation: fade-in 0.25s ease;
        }
        .modal-overlay.active { display: flex; }
        @keyframes fade-in { from { opacity: 0; transform: scale(0.92); } to { opacity: 1; transform: scale(1); } }
        .modal-panel {
            background: linear-gradient(145deg, #f5efe6, #e8ddd0);
            border-radius: 28px; padding: 32px 36px;
            max-width: 420px; width: 90%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
            position: relative; border: 2px solid rgba(255,248,220,0.3);
            max-height: 90vh; overflow-y: auto;
        }
        .modal-panel h2 { text-align: center; color: #4E342E; font-size: 22px; margin-bottom: 6px; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .modal-panel h2 .emoji-big { font-size: 32px; }
        .modal-panel .sub { text-align: center; color: #795548; font-size: 14px; margin-bottom: 18px; opacity: 0.7; }
        .modal-close {
            position: absolute; top: 12px; right: 16px;
            font-size: 28px; color: #795548; cursor: pointer;
            background: none; border: none; transition: 0.2s;
            width: 40px; height: 40px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
        }
        .modal-close:hover { background: rgba(0,0,0,0.08); transform: rotate(90deg); }
        .modal-field { margin-bottom: 18px; }
        .modal-field label { display: block; font-weight: 600; color: #4E342E; font-size: 14px; margin-bottom: 4px; }
        .size-group { display: flex; gap: 8px; flex-wrap: wrap; }
        .size-btn {
            padding: 6px 20px; border-radius: 20px; border: 2px solid #A1887F;
            background: rgba(255,255,255,0.5); cursor: pointer; font-weight: 600;
            color: #4E342E; transition: 0.25s; font-size: 14px;
        }
        .size-btn:hover { background: rgba(161,136,127,0.2); }
        .size-btn.active { background: #6D4C41; border-color: #4E342E; color: #fff; box-shadow: 0 2px 12px rgba(109,76,65,0.4); }
        .stat-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid rgba(0,0,0,0.06); }
        .stat-row .label { color: #5D4037; font-weight: 500; }
        .stat-row .value { font-weight: 700; color: #3E2723; }
        .modal-footer { margin-top: 20px; display: flex; gap: 10px; justify-content: flex-end; }
        .modal-footer button { padding: 10px 28px; border-radius: 24px; border: none; font-weight: 600; font-size: 15px; cursor: pointer; transition: 0.2s; }
        .modal-footer .btn-primary { background: #6D4C41; color: #fff; }
        .modal-footer .btn-primary:hover { background: #4E342E; transform: scale(1.02); }
        .modal-footer .btn-secondary { background: #D7CCC8; color: #4E342E; }
        .modal-footer .btn-secondary:hover { background: #BCAAA4; }

        .author-section {
            display: flex; align-items: center; gap: 14px;
            background: rgba(255,255,255,0.3);
            padding: 12px 16px;
            border-radius: 16px;
            margin-top: 16px;
            border: 1px solid rgba(161,136,127,0.3);
        }
        .author-section img {
            width: 44px; height: 44px;
            border-radius: 50%;
            border: 2px solid #6D4C41;
            object-fit: cover;
        }
        .author-section .info {
            display: flex; flex-direction: column;
        }
        .author-section .info .name {
            font-weight: 700; color: #4E342E; font-size: 16px;
        }
        .author-section .info .role {
            font-size: 12px; color: #795548; opacity: 0.7;
        }

        .settings-panel .toggle-row, .list-row { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid rgba(0,0,0,0.06); }
        .settings-panel .toggle-row .label, .list-row .label { font-weight: 600; color: #4E342E; font-size: 16px; }
        .toggle-switch {
            position: relative; width: 52px; height: 28px;
            background: #BDBDBD; border-radius: 14px;
            cursor: pointer; transition: 0.3s; flex-shrink: 0;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.15);
        }
        .toggle-switch.active { background: #6D4C41; }
        .toggle-switch .knob {
            position: absolute; top: 3px; left: 3px;
            width: 22px; height: 22px; background: #fff; border-radius: 50%;
            transition: 0.3s; box-shadow: 0 2px 6px rgba(0,0,0,0.25);
        }
        .toggle-switch.active .knob { left: 27px; }

        .battle-log {
            position: fixed; bottom: 60px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.7); backdrop-filter: blur(4px);
            color: #FFF8DC; padding: 8px 20px; border-radius: 16px;
            font-size: 14px; z-index: 60; max-width: 80%;
            text-align: center; pointer-events: none;
            transition: opacity 0.4s; opacity: 0;
            border: 1px solid rgba(255,248,220,0.15);
        }
        .battle-log.show { opacity: 1; }

        #controls {
            position: fixed; bottom: 30px; left: 0; right: 0;
            display: none;
            justify-content: space-between; align-items: flex-end;
            padding: 0 20px; z-index: 300;
            pointer-events: none;
        }
        #controls.active { display: flex; }

        #joystick-area {
            width: 130px; height: 130px;
            background: rgba(0,0,0,0.35); border-radius: 50%;
            border: 3px solid rgba(255,255,255,0.3);
            position: relative; pointer-events: auto;
            touch-action: none;
            backdrop-filter: blur(4px);
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
            flex-shrink: 0;
        }
        #joystick-knob {
            width: 50px; height: 50px;
            background: radial-gradient(circle, #ffd700, #b8860b);
            border-radius: 50%;
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 20px rgba(255,215,0,0.5);
            pointer-events: none;
            transition: none;
        }

        #attack-buttons {
            display: flex; gap: 14px;
            pointer-events: auto;
            flex-wrap: wrap;
            justify-content: flex-end;
        }
        .ctrl-btn {
            width: 70px; height: 70px;
            border-radius: 50%;
            border: 3px solid rgba(255,255,255,0.6);
            background: rgba(200,50,50,0.7);
            color: #fff; font-size: 14px; font-weight: bold;
            backdrop-filter: blur(4px);
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            cursor: pointer; touch-action: manipulation;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            text-shadow: 0 1px 4px rgba(0,0,0,0.5);
            transition: 0.1s;
            line-height: 1.2;
        }
        .ctrl-btn:active { transform: scale(0.88); background: rgba(255,80,80,0.9); }
        .ctrl-btn .sub { font-size: 10px; opacity: 0.8; font-weight: normal; }
        .ctrl-btn.remote { background: rgba(50,180,50,0.8); }
        .ctrl-btn.remote:active { background: rgba(50,255,50,0.9); }
        .ctrl-btn.poison { background: rgba(120,40,180,0.8); }
        .ctrl-btn.poison:active { background: rgba(180,60,220,0.9); }
        .ctrl-btn.summon { background: rgba(255,140,0,0.8); }
        .ctrl-btn.summon:active { background: rgba(255,180,0,0.9); }
        .ctrl-btn .cooldown {
            font-size: 11px; color: #ffcc00;
            background: rgba(0,0,0,0.5); padding: 0 6px; border-radius: 8px;
            margin-top: 2px;
        }
        .ctrl-btn.disabled { opacity: 0.4; pointer-events: none; }

        /* ===== 列表左滑删除 ===== */
        .list-item-wrap {
            position: relative;
            overflow: hidden;
            touch-action: pan-y;
        }
        .list-item-wrap .list-row {
            position: relative;
            z-index: 2;
            background: #f5efe6;
            transition: transform 0.25s ease;
            will-change: transform;
            padding: 12px 0;
            border-bottom: 1px solid rgba(0,0,0,0.06);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .list-item-wrap .list-row .label {
            font-weight: 600;
            color: #4E342E;
            font-size: 16px;
            flex: 1;
            padding: 0 12px;
        }
        .list-item-wrap .list-row .toggle-switch {
            margin-right: 12px;
            flex-shrink: 0;
        }
        .list-item-wrap .delete-btn {
            position: absolute;
            right: 0;
            top: 0;
            bottom: 0;
            width: 80px;
            background: #e53935;
            color: #fff;
            border: none;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            z-index: 1;
            border-radius: 0 8px 8px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }
        .list-item-wrap .delete-btn:active { background: #b71c1c; }
        .list-item-wrap .custom-tag {
            font-size: 11px;
            background: #7c5cfc;
            color: #fff;
            padding: 2px 10px;
            border-radius: 12px;
            margin-left: 8px;
            flex-shrink: 0;
        }

        .list-row .toggle-switch { margin-left: 10px; }

        @media (max-width: 600px) {
            .title { font-size: 1.2em; }
            .add-btn { width: 34px; height: 34px; font-size: 22px; left: 10px; }
            .settings-btn, .list-btn { width: 38px; height: 38px; font-size: 18px; }
            .list-btn { right: 56px; }
            .settings-btn { right: 12px; }
            #stopControlBtn { top: 60px; left: 10px; font-size: 12px; padding: 4px 12px; }
            .modal-panel { padding: 24px 20px; max-width: 95%; }
            .modal-panel h2 { font-size: 19px; }
            .size-btn { padding: 5px 14px; font-size: 13px; }
            .battle-log { font-size: 12px; padding: 6px 14px; bottom: 50px; max-width: 90%; }
            .insect .name-tag { font-size: 10px; top: -24px; padding: 1px 8px; }
            .hp-bar-wrap { height: 4px; bottom: -10px; }
            .dead-badge { font-size: 14px; padding: 2px 8px; }
            .dmg-float { font-size: 22px; }
            #joystick-area { width: 110px; height: 110px; }
            #joystick-knob { width: 42px; height: 42px; }
            .ctrl-btn { width: 60px; height: 60px; font-size: 12px; }
            #controls { padding: 0 10px; bottom: 20px; }
            .header-area { top: 10px; }
        }
        @media (max-width: 400px) {
            .modal-panel { padding: 18px 14px; }
            .size-btn { padding: 4px 10px; font-size: 12px; }
            .stat-row { font-size: 13px; }
            #joystick-area { width: 90px; height: 90px; }
            #joystick-knob { width: 36px; height: 36px; }
            .ctrl-btn { width: 50px; height: 50px; font-size: 11px; }
            #stopControlBtn { top: 55px; font-size: 11px; padding: 3px 10px; }
            .add-btn { width: 30px; height: 30px; font-size: 18px; left: 8px; }
        }
    </style>
</head>
<body>
    <div id="loadingScreen">
        <div class="loader"></div>
        <div class="loading-text">🌿 昆虫世界加载中...</div>
    </div>

    <!-- ===== 标题 + 加号按钮 ===== -->
    <div class="header-area">
        <button class="add-btn" id="addBtn" title="上传自定义昆虫 (最多5只)">+</button>
        <div class="title">🐞 昆虫对决 <small>⚔️</small></div>
    </div>

    <button id="stopControlBtn">⏹ 停止操控</button>

    <button class="list-btn" id="listBtn">📋</button>
    <button class="settings-btn" id="settingsBtn">⚙️</button>

    <div class="battle-log" id="battleLog"></div>

    <!-- 设置模态框 -->
    <div class="modal-overlay" id="settingsModal">
        <div class="modal-panel settings-panel">
            <button class="modal-close" id="settingsClose">✕</button>
            <h2>⚙️ 设置</h2>
            <div class="sub">游戏规则开关</div>
            <div class="toggle-row">
                <span class="label">⚔️ 允许战斗</span>
                <div class="toggle-switch active" id="fightToggle"><div class="knob"></div></div>
            </div>
            <div class="author-section">
                <img src="1.png" alt="作者头像">
                <div class="info">
                    <span class="name">🐜 Ants</span>
                    <span class="role">✨ 昆虫世界创造者</span>
                </div>
            </div>
            <div class="modal-footer" style="margin-top:16px;">
                <button class="btn-primary" id="settingsDone">完成</button>
            </div>
        </div>
    </div>

    <!-- 昆虫属性模态框 -->
