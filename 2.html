    <script>
        // ============================================================
        //  数据
        // ============================================================
        // 预设昆虫数据
        const PRESET_INSECT_DATA = [
            { name: '独角仙', file: '1.gif', baseHp: 150, baseAttack: 20, special: 'none' },
            { name: '螳螂', file: '2.gif', baseHp: 100, baseAttack: 28, special: 'none' },
            { name: '蝎子', file: '3.gif', baseHp: 130, baseAttack: 22, special: 'poison' },
            { name: '锹甲', file: '4.gif', baseHp: 170, baseAttack: 16, special: 'none' },
            { name: '象鼻虫', file: '5.gif', baseHp: 90, baseAttack: 12, special: 'none' },
            { name: '隐翅虫', file: '6.gif', baseHp: 80, baseAttack: 32, special: 'ranged' },
            { name: '竹节虫', file: '7.gif', baseHp: 110, baseAttack: 14, special: 'none' },
            { name: '蚁后', file: '8.gif', baseHp: 200, baseAttack: 25, special: 'summon' }
        ];

        // INSECT_DATA 将包含预设 + 自定义
        let INSECT_DATA = [...PRESET_INSECT_DATA];
        // 自定义昆虫数据（只存元数据，实际昆虫实例在 state.insects 中）
        let customMetaList = []; // { name, file, baseHp, baseAttack, special, isCustom: true, id: 唯一标识 }

        const SIZE_CONFIG = {
            small: { scale: 0.7, hpMult: 0.7, atkMult: 0.8, size: 56, label: '小' },
            medium: { scale: 1.0, hpMult: 1.0, atkMult: 1.0, size: 76, label: '中' },
            large: { scale: 1.3, hpMult: 1.4, atkMult: 1.2, size: 98, label: '大' }
        };

        const MAX_SUMMONED_ANTS = 10;
        const SUMMON_COOLDOWN = 20000;
        const ANT_ATTACK_COOLDOWN = 1500;
        const MIN_DIST = 90;
        const REVIVE_SECONDS = 20;
        const MELEE_RANGE = 65;
        const RANGED_RANGE = 350;
        const MAX_CUSTOM_INSECTS = 5;

        const state = {
            insects: [],
            selectedId: null,
            fightEnabled: true,
            isFighting: false,
            nextId: 1,
            battleLogTimeout: null,
            controlledInsect: null,
            joystickActive: false,
            joystickDir: { x: 0, y: 0 },
            poisonCooldown: 0,
            poisonCooldownMax: 4000,
            lastPoisonTime: 0,
            insectTypeEnabled: {},
            customCounter: 0, // 用于"未命名"自动编号
            customIdCounter: 0,
        };
        // 初始化启用状态
        PRESET_INSECT_DATA.forEach(d => state.insectTypeEnabled[d.name] = true);

        const $ = (s) => document.querySelector(s);
        const $$ = (s) => document.querySelectorAll(s);
        const body = document.body;
        const loadingScreen = $('#loadingScreen');
        const battleLog = $('#battleLog');
        const settingsBtn = $('#settingsBtn');
        const settingsModal = $('#settingsModal');
        const settingsClose = $('#settingsClose');
        const settingsDone = $('#settingsDone');
        const fightToggle = $('#fightToggle');
        const insectModal = $('#insectModal');
        const insectModalClose = $('#insectModalClose');
        const modalCloseBtn = $('#modalCloseBtn');
        const modalInsectName = $('#modalInsectName');
        const modalInsectStatus = $('#modalInsectStatus');
        const modalHp = $('#modalHp');
        const modalAttack = $('#modalAttack');
        const modalSizeMulti = $('#modalSizeMulti');
        const sizeGroup = $('#sizeGroup');
        const controlToggleBtn = $('#controlToggleBtn');
        const stopControlBtn = $('#stopControlBtn');
        const clickSound = $('#clickSound');
        const hitSound = $('#hitSound');
        const dieSound = $('#dieSound');
        const shootSound = $('#shootSound');
        const controlsDiv = $('#controls');
        const joystickArea = $('#joystick-area');
        const joystickKnob = $('#joystick-knob');
        const attackMelee = $('#attackMelee');
        const attackRemote = $('#attackRemote');
        const attackPoison = $('#attackPoison');
        const attackSummon = $('#attackSummon');
        const poisonCooldown = $('#poisonCooldown');
        const summonCooldown = $('#summonCooldown');
        const listBtn = $('#listBtn');
        const listModal = $('#listModal');
        const listClose = $('#listClose');
        const listContainer = $('#listContainer');
        const listAllOff = $('#listAllOff');
        const listAllOn = $('#listAllOn');
        const addBtn = $('#addBtn');
        const fileInput = $('#fileInput');

        // ============================================================
        //  工具函数
        // ============================================================
        function rand(min, max) { return min + Math.random() * (max - min); }
        function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }
        function dist(a, b) { return Math.sqrt((a.x - b.x) ** 2 + (a.y - b.y) ** 2); }

        function getRandomPosition(margin = 90) {
            const w = window.innerWidth, h = window.innerHeight;
            return { x: margin + Math.random() * (w - margin * 2 - 80), y: margin + Math.random() * (h - margin * 2 - 80) };
        }
        function isOverlapping(pos, others, minD) {
            for (const o of others) if (dist(pos, o) < minD) return true;
            return false;
        }
        function getUniquePosition(others, minD = MIN_DIST, maxAttempts = 60) {
            for (let i = 0; i < maxAttempts; i++) {
                const pos = getRandomPosition();
                if (!isOverlapping(pos, others, minD)) return pos;
            }
            return getRandomPosition(40);
        }

        function showLog(msg, duration = 2000) {
            battleLog.textContent = msg;
            battleLog.classList.add('show');
            clearTimeout(state.battleLogTimeout);
            state.battleLogTimeout = setTimeout(() => battleLog.classList.remove('show'), duration);
        }
        function playSound(el) {
            try { el.currentTime = 0; el.play().catch(() => {}); } catch (_) {}
        }

        // ============================================================
        //  创建昆虫（预设 + 自定义通用）
        // ============================================================
        function createInsect(data, index) {
            const others = state.insects.map(i => ({ x: i.x, y: i.y }));
            const pos = getUniquePosition(others);
            const sizeKey = 'medium';
            const sizeCfg = SIZE_CONFIG[sizeKey];
            const baseHp = data.baseHp, baseAtk = data.baseAttack;
            const maxHp = Math.round(baseHp * sizeCfg.hpMult);
            const atk = Math.round(baseAtk * sizeCfg.atkMult);

            const inst = {
                id: state.nextId++,
                name: data.name,
                file: data.file,
                x: pos.x, y: pos.y,
                vx: rand(-1.2, 1.2), vy: rand(-1.2, 1.2),
                size: sizeKey,
                baseHp, baseAttack: baseAtk,
                hp: maxHp, maxHp: maxHp,
                attack: atk,
                isDead: false,
                reviveTimer: null,
                reviveCountdown: 0,
                special: data.special,
                element: null,
                nameTag: null, hpFill: null, deadBadge: null, reviveTimerEl: null,
                isPlayer: false,
                attackCooldown: 0,
                poisonReady: true,
                poisonCooldownTimer: null,
                summonCooldownUntil: 0,
                active: true,
                isSummoned: false,
                summonerId: null,
                lastAttackTime: 0,
                isCustom: data.isCustom || false,
                customId: data.customId || null,
            };

            const div = document.createElement('div');
            div.className = 'insect';
            div.dataset.id = inst.id;
            const sz = sizeCfg.size;
            div.style.width = sz + 'px'; div.style.height = sz + 'px';
            div.style.left = inst.x + 'px'; div.style.top = inst.y + 'px';

            const img = document.createElement('img');
            img.src = data.file; img.alt = data.name;
            const nameTag = document.createElement('div');
            nameTag.className = 'name-tag';
            nameTag.textContent = data.name;
            const hpWrap = document.createElement('div');
            hpWrap.className = 'hp-bar-wrap';
            const hpFill = document.createElement('div');
            hpFill.className = 'hp-bar-fill';
            hpFill.style.width = '100%';
            hpWrap.appendChild(hpFill);
            const deadBadge = document.createElement('div');
            deadBadge.className = 'dead-badge';
            deadBadge.textContent = '💀 死亡';
            const reviveTimerEl = document.createElement('div');
            reviveTimerEl.className = 'revive-timer';
            reviveTimerEl.textContent = '';

            div.appendChild(img);
            div.appendChild(nameTag);
            div.appendChild(hpWrap);
            div.appendChild(deadBadge);
            div.appendChild(reviveTimerEl);
            body.appendChild(div);

            inst.element = div;
            inst.nameTag = nameTag;
            inst.hpFill = hpFill;
            inst.deadBadge = deadBadge;
            inst.reviveTimerEl = reviveTimerEl;

            // 事件绑定
            let pressTimer = null, isLongPress = false, pressStartX = 0, pressStartY = 0;
            const startPress = (e) => {
                if (!inst.active || inst.isSummoned) return;
                const touch = e.touches ? e.touches[0] : e;
                pressStartX = touch.clientX; pressStartY = touch.clientY;
                isLongPress = false;
                clearTimeout(pressTimer);
                pressTimer = setTimeout(() => { isLongPress = true; handleLongPress(inst); }, 500);
            };
            const endPress = (e) => {
                if (!inst.active || inst.isSummoned) return;
                clearTimeout(pressTimer);
                if (!isLongPress) handleClick(inst, e);
                isLongPress = false;
            };
            const movePress = (e) => {
                if (!pressTimer) return;
                const touch = e.touches ? e.touches[0] : e;
                const dx = touch.clientX - pressStartX, dy = touch.clientY - pressStartY;
                if (Math.sqrt(dx*dx + dy*dy) > 15) { clearTimeout(pressTimer); pressTimer = null; }
            };
            div.addEventListener('mousedown', startPress);
            div.addEventListener('mouseup', endPress);
            div.addEventListener('mouseleave', () => { clearTimeout(pressTimer); });
            div.addEventListener('mousemove', movePress);
            div.addEventListener('touchstart', startPress, { passive: true });
            div.addEventListener('touchend', endPress, { passive: true });
            div.addEventListener('touchmove', movePress, { passive: true });
            div.addEventListener('touchcancel', () => { clearTimeout(pressTimer); }, { passive: true });
            div.addEventListener('contextmenu', (e) => e.preventDefault());

            state.insects.push(inst);
            return inst;
        }

        // ============================================================
        //  创建小蚂蚁（召唤物）- 使用 小蚂蚁.gif
        // ============================================================
        function createSummonedAnt(summoner) {
            if (!summoner || !summoner.active || summoner.isDead) return null;
            const count = state.insects.filter(i => i.isSummoned && i.summonerId === summoner.id).length;
            if (count >= MAX_SUMMONED_ANTS) {
                showLog('🐜 小蚂蚁已达上限 (10只)', 1200);
                return null;
            }

            const others = state.insects.map(i => ({ x: i.x, y: i.y }));
            const pos = getUniquePosition(others, 40, 30);
            const antSize = 32;

            const inst = {
                id: state.nextId++,
                name: '小蚂蚁',
                file: '小蚂蚁.gif', // 改为 gif
                x: pos.x, y: pos.y,
                vx: rand(-0.5, 0.5), vy: rand(-0.5, 0.5),
                size: 'small',
                baseHp: 50, baseAttack: 10,
                hp: 50, maxHp: 50,
                attack: 10,
                isDead: false,
                reviveTimer: null,
                reviveCountdown: 0,
                special: 'none',
                element: null,
                nameTag: null, hpFill: null, deadBadge: null, reviveTimerEl: null,
                isPlayer: false,
                attackCooldown: 0,
                poisonReady: false,
                poisonCooldownTimer: null,
                summonCooldownUntil: 0,
                active: true,
                isSummoned: true,
                summonerId: summoner.id,
                lastAttackTime: 0,
                isCustom: false,
                customId: null,
            };

            const div = document.createElement('div');
            div.className = 'insect';
            div.dataset.id = inst.id;
            div.style.width = antSize + 'px';
            div.style.height = antSize + 'px';
            div.style.left = inst.x + 'px';
            div.style.top = inst.y + 'px';

            const img = document.createElement('img');
            img.src = inst.file; img.alt = inst.name;
            const nameTag = document.createElement('div');
            nameTag.className = 'name-tag';
            nameTag.textContent = inst.name;
            const hpWrap = document.createElement('div');
            hpWrap.className = 'hp-bar-wrap';
            hpWrap.style.width = '80%';
            const hpFill = document.createElement('div');
            hpFill.className = 'hp-bar-fill';
            hpFill.style.width = '100%';
            hpWrap.appendChild(hpFill);
            const deadBadge = document.createElement('div');
            deadBadge.className = 'dead-badge';
            deadBadge.textContent = '💀';
            deadBadge.style.fontSize = '12px';
            deadBadge.style.padding = '2px 6px';
            const reviveTimerEl = document.createElement('div');
            reviveTimerEl.className = 'revive-timer';
            reviveTimerEl.textContent = '';

            div.appendChild(img);
            div.appendChild(nameTag);
            div.appendChild(hpWrap);
            div.appendChild(deadBadge);
            div.appendChild(reviveTimerEl);
            body.appendChild(div);

            inst.element = div;
            inst.nameTag = nameTag;
            inst.hpFill = hpFill;
            inst.deadBadge = deadBadge;
            inst.reviveTimerEl = reviveTimerEl;
            div.style.pointerEvents = 'none';

            state.insects.push(inst);
            showLog(`🐜 召唤了一只小蚂蚁！ (${count + 1}/${MAX_SUMMONED_ANTS})`, 1500);
            return inst;
        }

        // ============================================================
        //  自定义昆虫上传
        // ============================================================
        function getNextCustomName(baseName) {
            const existing = customMetaList.map(m => m.name);
            if (!existing.includes(baseName)) return baseName;
            let i = 1;
            while (existing.includes(baseName + i)) i++;
            return baseName + i;
        }

        function handleFileUpload(file) {
            if (customMetaList.length >= MAX_CUSTOM_INSECTS) {
                showLog(`⚠️ 最多上传 ${MAX_CUSTOM_INSECTS} 只自定义昆虫`, 2000);
                return;
            }
            if (!file.type.startsWith('image/')) {
                showLog('⚠️ 请上传图片文件', 1500);
                return;
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                const dataUrl = e.target.result;
                // 弹出命名对话框
                const defaultName = '未命名';
                const uniqueName = getNextCustomName(defaultName);
                const userInput = prompt('给这只昆虫起个名字（留空则自动命名）:', uniqueName);
                let finalName = (userInput && userInput.trim()) ? userInput.trim() : uniqueName;
                // 如果名字已存在，自动加编号
                const existingNames = customMetaList.map(m => m.name);
                if (existingNames.includes(finalName)) {
                    let i = 1;
                    while (existingNames.includes(finalName + i)) i++;
                    finalName = finalName + i;
                }

                // 创建自定义元数据
                const customData = {
                    name: finalName,
                    file: dataUrl,
                    baseHp: 100,
                    baseAttack: 15,
                    special: 'none',
                    isCustom: true,
                    customId: ++state.customIdCounter,
                };
                customMetaList.push(customData);

                // 添加到 INSECT_DATA
                INSECT_DATA.push(customData);
                state.insectTypeEnabled[finalName] = true;

                // 创建昆虫实例
                const inst = createInsect(customData, INSECT_DATA.length - 1);
                // 标记为自定义
                inst.isCustom = true;
                inst.customId = customData.customId;

                // 更新列表
                if (listModal.classList.contains('active')) renderListModal();

                showLog(`✅ 已添加自定义昆虫: ${finalName} (${customMetaList.length}/${MAX_CUSTOM_INSECTS})`, 2000);
                updateAddBtnState();
            };
            reader.readAsDataURL(file);
        }

        function updateAddBtnState() {
            if (customMetaList.length >= MAX_CUSTOM_INSECTS) {
                addBtn.classList.add('disabled');
                addBtn.title = `已达上限 (${MAX_CUSTOM_INSECTS}只)`;
            } else {
                addBtn.classList.remove('disabled');
                addBtn.title = `上传自定义昆虫 (${customMetaList.length}/${MAX_CUSTOM_INSECTS})`;
            }
        }

        // ============================================================
        //  删除自定义昆虫（只能删除自定义的）
        // ============================================================
        function deleteCustomInsect(customId) {
            // 从 customMetaList 中移除
            const idx = customMetaList.findIndex(m => m.customId === customId);
            if (idx === -1) return false;
            const meta = customMetaList[idx];
            const name = meta.name;

            // 从 INSECT_DATA 中移除
            const dataIdx = INSECT_DATA.findIndex(d => d.isCustom && d.customId === customId);
            if (dataIdx !== -1) INSECT_DATA.splice(dataIdx, 1);

            // 从 state.insectTypeEnabled 中移除
            delete state.insectTypeEnabled[name];

            // 查找并移除对应的昆虫实例
            const toRemove = state.insects.filter(i => i.isCustom && i.customId === customId);
            for (const inst of toRemove) {
                if (inst.reviveTimer) clearInterval(inst.reviveTimer);
                if (inst.element && inst.element.parentNode) {
                    inst.element.parentNode.removeChild(inst.element);
                }
                // 如果当前选中的是这个昆虫，取消选中
                if (state.selectedId === inst.id) state.selectedId = null;
                if (state.controlledInsect && state.controlledInsect.id === inst.id) {
                    stopControl();
                }
            }
            state.insects = state.insects.filter(i => !(i.isCustom && i.customId === customId));

            customMetaList.splice(idx, 1);
            updateAddBtnState();

            // 更新列表
            if (listModal.classList.contains('active')) renderListModal();
            showLog(`🗑️ 已删除自定义昆虫: ${name}`, 1500);
            return true;
        }

        // ============================================================
        //  列表模态框（支持左滑删除）
        // ============================================================
        function renderListModal() {
            listContainer.innerHTML = '';
            // 先渲染预设
            for (const data of PRESET_INSECT_DATA) {
                const wrap = document.createElement('div');
                wrap.className = 'list-item-wrap';
                const row = document.createElement('div');
                row.className = 'list-row';
                const label = document.createElement('span');
                label.className = 'label';
                label.textContent = data.name;
                const toggle = document.createElement('div');
                toggle.className = 'toggle-switch' + (state.insectTypeEnabled[data.name] ? ' active' : '');
                toggle.innerHTML = '<div class="knob"></div>';
                toggle.addEventListener('click', () => {
                    const newState = !state.insectTypeEnabled[data.name];
                    state.insectTypeEnabled[data.name] = newState;
                    toggle.classList.toggle('active', newState);
                    updateInsectVisibility();
                    if (!newState) showLog(`🚫 ${data.name} 已关闭`, 1000);
                    else showLog(`✅ ${data.name} 已开启`, 1000);
                });
                row.appendChild(label);
                row.appendChild(toggle);
                wrap.appendChild(row);
                listContainer.appendChild(wrap);
            }

            // 渲染自定义
            for (const meta of customMetaList) {
                const wrap = document.createElement('div');
                wrap.className = 'list-item-wrap';
                wrap.dataset.customId = meta.customId;

                const row = document.createElement('div');
                row.className = 'list-row';
                const label = document.createElement('span');
                label.className = 'label';
                label.textContent = meta.name;
                const tag = document.createElement('span');
                tag.className = 'custom-tag';
                tag.textContent = '自定义';
                label.appendChild(tag);

                const toggle = document.createElement('div');
                toggle.className = 'toggle-switch' + (state.insectTypeEnabled[meta.name] ? ' active' : '');
                toggle.innerHTML = '<div class="knob"></div>';
                toggle.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const newState = !state.insectTypeEnabled[meta.name];
                    state.insectTypeEnabled[meta.name] = newState;
                    toggle.classList.toggle('active', newState);
                    updateInsectVisibility();
                    if (!newState) showLog(`🚫 ${meta.name} 已关闭`, 1000);
                    else showLog(`✅ ${meta.name} 已开启`, 1000);
                });

                // 删除按钮
                const delBtn = document.createElement('button');
                delBtn.className = 'delete-btn';
                delBtn.textContent = '删除';
                delBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (confirm(`确定要删除 "${meta.name}" 吗？`)) {
                        deleteCustomInsect(meta.customId);
                    }
                });

                row.appendChild(label);
                row.appendChild(toggle);
                wrap.appendChild(row);
                wrap.appendChild(delBtn);
                listContainer.appendChild(wrap);

                // ===== 左滑删除手势 =====
                let startX = 0, startY = 0, isSwiping = false, currentX = 0;
                const rowEl = row;
                const wrapEl = wrap;

                const onTouchStart = (e) => {
                    const touch = e.touches[0];
                    startX = touch.clientX;
                    startY = touch.clientY;
                    isSwiping = false;
                    currentX = 0;
                    rowEl.style.transition = 'none';
                };
                const onTouchMove = (e) => {
                    const touch = e.touches[0];
                    const dx = touch.clientX - startX;
                    const dy = touch.clientY - startY;
                    if (Math.abs(dx) > 10 || Math.abs(dy) > 10) {
                        isSwiping = true;
                        e.preventDefault();
                    }
                    if (isSwiping && Math.abs(dx) > 10) {
                        const maxSwipe = -80;
                        const newX = Math.max(maxSwipe, Math.min(0, dx));
                        currentX = newX;
                        rowEl.style.transform = `translateX(${newX}px)`;
                    }
                };
                const onTouchEnd = (e) => {
                    rowEl.style.transition = 'transform 0.25s ease';
                    if (currentX < -40) {
                        // 展开删除按钮
                        rowEl.style.transform = 'translateX(-80px)';
                        currentX = -80;
                    } else {
                        rowEl.style.transform = 'translateX(0)';
                        currentX = 0;
                    }
                    isSwiping = false;
                };

                wrapEl.addEventListener('touchstart', onTouchStart, { passive: true });
                wrapEl.addEventListener('touchmove', onTouchMove, { passive: false });
                wrapEl.addEventListener('touchend', onTouchEnd, { passive: true });
                wrapEl.addEventListener('touchcancel', onTouchEnd, { passive: true });

                // 点击其他地方收起
                document.addEventListener('click', (e) => {
                    if (!wrapEl.contains(e.target)) {
                        if (currentX < -40) {
                            rowEl.style.transition = 'transform 0.25s ease';
                            rowEl.style.transform = 'translateX(0)';
                            currentX = 0;
                        }
                    }
                });
            }
        }

        // ============================================================
        //  移除所有召唤物
        // ============================================================
        function removeAllSummonedAnts() {
            const toRemove = state.insects.filter(i => i.isSummoned);
            for (const inst of toRemove) {
                if (inst.reviveTimer) clearInterval(inst.reviveTimer);
                if (inst.element && inst.element.parentNode) {
                    inst.element.parentNode.removeChild(inst.element);
                }
            }
            if (toRemove.length > 0) {
                state.insects = state.insects.filter(i => !i.isSummoned);
                showLog('🔇 战斗关闭，所有召唤物已消失', 1500);
            }
        }

        // ============================================================
        //  更新昆虫可见性（列表管理）
        // ============================================================
        function updateInsectVisibility() {
            for (const inst of state.insects) {
                if (inst.isSummoned) continue;
                const enabled = state.insectTypeEnabled[inst.name] !== false;
                inst.active = enabled;
                if (inst.element) {
                    inst.element.style.display = enabled ? '' : 'none';
                }
                if (!enabled && inst.isPlayer) {
                    stopControl();
                }
                if (!enabled && inst.name === '蚁后') {
                    const ants = state.insects.filter(i => i.isSummoned && i.summonerId === inst.id);
                    for (const ant of ants) {
                        if (ant.reviveTimer) clearInterval(ant.reviveTimer);
                        if (ant.element && ant.element.parentNode) ant.element.parentNode.removeChild(ant.element);
                    }
                    state.insects = state.insects.filter(i => !(i.isSummoned && i.summonerId === inst.id));
                }
                if (!enabled && inst.isDead && inst.reviveTimer) {
                    clearInterval(inst.reviveTimer);
                    inst.reviveTimer = null;
                }
            }
        }

        function openListModal() {
            renderListModal();
            listModal.classList.add('active');
        }

        // ============================================================
        //  点击/长按处理（不变）
        // ============================================================
        function handleClick(inst, event) {
            if (!inst.active || inst.isSummoned) return;
            if (inst.isDead) { playSound(clickSound); showLog(`${inst.name} 已经死亡 💀`, 1200); return; }
            playSound(clickSound);
            const rect = inst.element.getBoundingClientRect();
            const cx = rect.left + rect.width/2 - 50, cy = rect.top + rect.height/2 - 50;
            const effect = document.createElement('div');
            effect.className = 'click-effect';
            effect.style.left = cx + 'px'; effect.style.top = cy + 'px';
            body.appendChild(effect);
            setTimeout(() => effect.remove(), 600);

            if (!state.fightEnabled) { showLog(`🔇 战斗已关闭，${inst.name} 在散步`, 1000); return; }
            if (state.isFighting) { showLog('⏳ 战斗中，请稍候...', 1000); return; }

            if (state.selectedId === null) {
                selectInsect(inst.id);
                showLog(`👆 选中 ${inst.name}，点击另一只昆虫发起战斗`, 1500);
                return;
            }
            if (state.selectedId === inst.id) {
                deselectInsect();
                showLog(`✖️ 取消选中 ${inst.name}`, 800);
                return;
            }

            const attacker = state.insects.find(i => i.id === state.selectedId);
            if (!attacker || attacker.isDead || !attacker.active) { deselectInsect(); showLog('❌ 选中的昆虫不可用', 1000); return; }
            if (attacker.id === inst.id) return;
            if (inst.isDead) { showLog(`❌ ${inst.name} 已死亡，无法战斗`, 1200); deselectInsect(); return; }
            startBattle(attacker, inst);
        }

        function selectInsect(id) {
            deselectInsect();
            state.selectedId = id;
            const inst = state.insects.find(i => i.id === id);
            if (inst && !inst.isDead && inst.active && !inst.isSummoned) inst.element.classList.add('selected');
            else state.selectedId = null;
        }
        function deselectInsect() {
            if (state.selectedId !== null) {
                const prev = state.insects.find(i => i.id === state.selectedId);
                if (prev) prev.element.classList.remove('selected');
                state.selectedId = null;
            }
        }

        let modalTargetId = null;
        function handleLongPress(inst) {
            if (!inst.active || inst.isSummoned) return;
            if (document.activeElement) document.activeElement.blur();
            modalTargetId = inst.id;
            openInsectModal(inst);
            if (navigator.vibrate) navigator.vibrate(20);
        }

        function openInsectModal(inst) {
            modalTargetId = inst.id;
            updateModalContent(inst);
            insectModal.classList.add('active');
        }
        function updateModalContent(inst) {
            const sizeCfg = SIZE_CONFIG[inst.size];
            modalInsectName.innerHTML = `<span class="emoji-big">🐛</span> ${inst.name}`;
            modalInsectStatus.textContent = `状态：${inst.isDead ? '💀 死亡' : '✅ 存活'}`;
            modalInsectStatus.style.color = inst.isDead ? '#c62828' : '#2E7D32';
            modalHp.textContent = `${inst.hp} / ${inst.maxHp}`;
            modalAttack.textContent = inst.attack;
            modalSizeMulti.textContent = `${sizeCfg.hpMult.toFixed(1)}x 血量 / ${sizeCfg.atkMult.toFixed(1)}x 攻击`;
            const btns = sizeGroup.querySelectorAll('.size-btn');
            btns.forEach(btn => btn.classList.toggle('active', btn.dataset.size === inst.size));
            if (state.controlledInsect && state.controlledInsect.id === inst.id) {
                controlToggleBtn.textContent = '🛑 停止操控';
            } else {
                controlToggleBtn.textContent = '🎮 操控此昆虫';
            }
            controlToggleBtn.disabled = inst.isDead || !inst.active;
        }
        function closeInsectModal() {
            insectModal.classList.remove('active');
            modalTargetId = null;
        }

        // ============================================================
        //  操控/停止操控
        // ============================================================
        function stopControl() {
            if (state.controlledInsect) {
                state.controlledInsect.isPlayer = false;
                state.controlledInsect.element.style.border = 'none';
                state.controlledInsect.element.style.borderRadius = '';
                controlsDiv.classList.remove('active');
                stopControlBtn.style.display = 'none';
                state.controlledInsect = null;
                if (modalTargetId !== null) {
                    const inst = state.insects.find(i => i.id === modalTargetId);
                    if (inst) updateModalContent(inst);
                }
                showLog('🛑 已停止操控', 1000);
            }
        }

        function toggleControl(inst) {
            if (inst.isDead || !inst.active || inst.isSummoned) { showLog('❌ 无法操控此昆虫', 1200); return; }
            if (state.controlledInsect) {
                if (state.controlledInsect.id === inst.id) {
                    stopControl();
                    closeInsectModal();
                    return;
                }
                stopControl();
            }
            inst.isPlayer = true;
            state.controlledInsect = inst;
            inst.element.style.border = '3px solid #00ff88';
            inst.element.style.borderRadius = '50%';
            controlsDiv.classList.add('active');
            stopControlBtn.style.display = 'block';
            updateControlButtons(inst);
            closeInsectModal();
            showLog(`🎮 你现在操控 ${inst.name}`, 1500);
        }

        function updateControlButtons(inst) {
            attackMelee.style.display = 'flex';
            attackRemote.style.display = 'none';
            attackPoison.style.display = 'none';
            attackSummon.style.display = 'none';
            if (inst.special === 'ranged') attackRemote.style.display = 'flex';
            if (inst.special === 'poison') {
                attackPoison.style.display = 'flex';
                updatePoisonCooldownUI();
            }
            if (inst.special === 'summon') {
                attackSummon.style.display = 'flex';
                updateSummonCooldownUI();
            }
        }

        function updatePoisonCooldownUI() {
            const inst = state.controlledInsect;
            if (!inst || inst.special !== 'poison') return;
            const now = Date.now();
            const elapsed = now - state.lastPoisonTime;
            const remaining = Math.max(0, state.poisonCooldownMax - elapsed);
            if (remaining > 0) {
                const sec = (remaining / 1000).toFixed(1);
                poisonCooldown.textContent = `⏳${sec}s`;
                attackPoison.classList.add('disabled');
            } else {
                poisonCooldown.textContent = '✓';
                attackPoison.classList.remove('disabled');
            }
        }

        function updateSummonCooldownUI() {
            const inst = state.controlledInsect;
            if (!inst || inst.special !== 'summon') return;
            const now = Date.now();
            const remaining = Math.max(0, inst.summonCooldownUntil - now);
            if (remaining > 0) {
                const sec = (remaining / 1000).toFixed(1);
                summonCooldown.textContent = `⏳${sec}s`;
                attackSummon.classList.add('disabled');
            } else {
                summonCooldown.textContent = '✓';
                attackSummon.classList.remove('disabled');
            }
        }

        // ============================================================
        //  战斗系统
        // ============================================================
        function startBattle(attacker, defender) {
            if (attacker.special === 'summon' && defender.isSummoned) {
                showLog('🐜 蚁后不能攻击小蚂蚁', 1000);
                deselectInsect();
                return;
            }
            if (state.isFighting) return;
            if (!attacker.active || !defender.active || attacker.isDead || defender.isDead) { showLog('❌ 其中一方不可用', 1000); deselectInsect(); return; }
            if (!state.fightEnabled) { showLog('🔇 战斗已关闭', 800); deselectInsect(); return; }
            performAttack(attacker, defender, false);
        }

        function performAttack(attacker, defender, isCounter = false) {
            if (attacker.special === 'summon' && defender.isSummoned) {
                if (attacker.isPlayer) showLog('🐜 蚁后不能攻击小蚂蚁', 800);
                return;
            }
            if (!isCounter && state.isFighting) return;
            if (!state.fightEnabled) return;
            if (!attacker.active || !defender.active || attacker.isDead || defender.isDead) return;

            const d = dist(attacker, defender);
            const maxRange = (attacker.isPlayer || isCounter) ? MELEE_RANGE * 1.5 : MELEE_RANGE;
            if (d > maxRange) {
                if (attacker.isPlayer) showLog('📏 距离太远，请靠近', 800);
                return;
            }

            if (!isCounter) state.isFighting = true;

            attacker.element.classList.add('attacking');
            defender.element.classList.add('hit');

            const dmg = Math.round(attacker.attack * (0.85 + Math.random() * 0.3));
            const newHp = Math.max(0, defender.hp - dmg);
            defender.hp = newHp;
            showDamageNumber(defender, dmg);
            playSound(hitSound);
            showLog(`⚔️ ${attacker.name} 攻击 ${defender.name}，造成 ${dmg} 点伤害！`, 1800);
            updateHpBar(defender);

            if (defender.hp <= 0) {
                defender.hp = 0;
                setDead(defender);
                playSound(dieSound);
                showLog(`💀 ${defender.name} 被 ${attacker.name} 击败！`, 2500);
            } else {
                if (!defender.isPlayer) {
                    setTimeout(() => {
                        if (!defender.isDead && !attacker.isDead && state.fightEnabled) {
                            performAttack(defender, attacker, true);
                        }
                    }, 500);
                }
            }

            setTimeout(() => {
                attacker.element.classList.remove('attacking');
                defender.element.classList.remove('hit');
                if (!isCounter) state.isFighting = false;
                if (attacker.isDead || defender.isDead) deselectInsect();
            }, 800);
        }

        function performRangedAttack(attacker) {
            if (!attacker.isPlayer || !attacker.active) return;
            if (attacker.isDead) { showLog('💀 已死亡', 800); return; }
            if (!state.fightEnabled) { showLog('🔇 战斗已关闭', 800); return; }

            let target = null;
            let minDist = Infinity;
            for (const inst of state.insects) {
                if (inst.id === attacker.id || inst.isDead || !inst.active || inst.isSummoned) continue;
                const d = dist(attacker, inst);
                if (d < RANGED_RANGE && d < minDist) {
                    minDist = d;
                    target = inst;
                }
            }
            if (!target) { showLog('🌿 没有在射程内的敌人', 1000); return; }

            const proj = document.createElement('div');
            proj.className = 'projectile';
            const rect = attacker.element.getBoundingClientRect();
            const startX = rect.left + rect.width/2 - 10;
            const startY = rect.top + rect.height/2 - 10;
            proj.style.left = startX + 'px';
            proj.style.top = startY + 'px';
            body.appendChild(proj);

            const targetRect = target.element.getBoundingClientRect();
            const endX = targetRect.left + targetRect.width/2 - 10;
            const endY = targetRect.top + targetRect.height/2 - 10;
            const duration = 400;
            const startTime = Date.now();
            const startLeft = startX, startTop = startY;
            playSound(shootSound);

            function animateProjectile() {
                const now = Date.now();
                const progress = Math.min((now - startTime) / duration, 1);
                const cx = startLeft + (endX - startLeft) * progress;
                const cy = startTop + (endY - startTop) * progress;
                proj.style.left = cx + 'px';
                proj.style.top = cy + 'px';
                if (progress < 1) {
                    requestAnimationFrame(animateProjectile);
                } else {
                    proj.remove();
                    if (state.fightEnabled && !target.isDead && target.active && dist(attacker, target) < RANGED_RANGE) {
                        const dmg = Math.round(attacker.attack * (0.7 + Math.random() * 0.2));
                        target.hp = Math.max(0, target.hp - dmg);
                        showDamageNumber(target, dmg);
                        updateHpBar(target);
                        playSound(hitSound);
                        showLog(`🌿 ${attacker.name} 远程攻击 ${target.name}，造成 ${dmg} 点伤害！`, 1500);
                        if (target.hp <= 0) {
                            target.hp = 0;
                            setDead(target);
                            playSound(dieSound);
                            showLog(`💀 ${target.name} 被 ${attacker.name} 远程击杀！`, 2500);
                        } else {
                            if (!target.isPlayer) {
                                setTimeout(() => {
                                    if (!target.isDead && !attacker.isDead && state.fightEnabled) {
                                        performAttack(target, attacker, true);
                                    }
                                }, 500);
                            }
                        }
                    }
                }
            }
            animateProjectile();
        }

        function performPoisonAttack(attacker) {
            if (!attacker.isPlayer || !attacker.active) return;
            if (attacker.isDead) { showLog('💀 已死亡', 800); return; }
            if (!state.fightEnabled) { showLog('🔇 战斗已关闭', 800); return; }
            const now = Date.now();
            if (now - state.lastPoisonTime < state.poisonCooldownMax) {
                showLog('☠️ 毒技能冷却中', 1000);
                return;
            }

            let target = null;
            let minDist = Infinity;
            for (const inst of state.insects) {
                if (inst.id === attacker.id || inst.isDead || !inst.active || inst.isSummoned) continue;
                const d = dist(attacker, inst);
                if (d < RANGED_RANGE && d < minDist) {
                    minDist = d;
                    target = inst;
                }
            }
            if (!target) { showLog('☠️ 没有在射程内的敌人', 1000); return; }

            state.lastPoisonTime = now;
            updatePoisonCooldownUI();

            const proj = document.createElement('div');
            proj.className = 'projectile poison';
            const rect = attacker.element.getBoundingClientRect();
            const startX = rect.left + rect.width/2 - 10;
            const startY = rect.top + rect.height/2 - 10;
            proj.style.left = startX + 'px';
            proj.style.top = startY + 'px';
            body.appendChild(proj);

            const targetRect = target.element.getBoundingClientRect();
            const endX = targetRect.left + targetRect.width/2 - 10;
            const endY = targetRect.top + targetRect.height/2 - 10;
            const duration = 500;
            const startTime = Date.now();
            const startLeft = startX, startTop = startY;
            playSound(shootSound);

            function animatePoison() {
                const now = Date.now();
                const progress = Math.min((now - startTime) / duration, 1);
                const cx = startLeft + (endX - startLeft) * progress;
                const cy = startTop + (endY - startTop) * progress;
                proj.style.left = cx + 'px';
                proj.style.top = cy + 'px';
                if (progress < 1) {
                    requestAnimationFrame(animatePoison);
                } else {
                    proj.remove();
                    if (state.fightEnabled && !target.isDead && target.active && dist(attacker, target) < RANGED_RANGE) {
                        const dmg = Math.round(attacker.attack * 1.5);
                        target.hp = Math.max(0, target.hp - dmg);
                        showDamageNumber(target, dmg);
                        updateHpBar(target);
                        playSound(hitSound);
                        showLog(`☠️ ${attacker.name} 毒击 ${target.name}，造成 ${dmg} 点伤害！`, 1500);
                        if (target.hp <= 0) {
                            target.hp = 0;
                            setDead(target);
                            playSound(dieSound);
                            showLog(`💀 ${target.name} 被毒死！`, 2500);
                        } else {
                            if (!target.isPlayer) {
                                setTimeout(() => {
                                    if (!target.isDead && !attacker.isDead && state.fightEnabled) {
                                        performAttack(target, attacker, true);
                                    }
                                }, 500);
                            }
                        }
                    }
                }
            }
            animatePoison();

            const cooldownInterval = setInterval(() => {
                updatePoisonCooldownUI();
                if (Date.now() - state.lastPoisonTime >= state.poisonCooldownMax) {
                    clearInterval(cooldownInterval);
                }
            }, 200);
        }

        function performSummon(attacker) {
            if (!attacker.isPlayer || !attacker.active) return;
            if (attacker.isDead) { showLog('💀 已死亡', 800); return; }
            if (!state.fightEnabled) { showLog('🔇 战斗已关闭', 800); return; }
            const now = Date.now();
            if (now < attacker.summonCooldownUntil) {
                showLog('🐜 召唤冷却中', 1000);
                return;
            }
            const count = state.insects.filter(i => i.isSummoned && i.summonerId === attacker.id).length;
            if (count >= MAX_SUMMONED_ANTS) {
                showLog('🐜 小蚂蚁已达上限 (10只)', 1200);
                return;
            }
            attacker.summonCooldownUntil = now + SUMMON_COOLDOWN;
            createSummonedAnt(attacker);
            updateSummonCooldownUI();
            playSound(shootSound);
        }

        function performSummonedAntAttack(ant, target) {
            if (!state.fightEnabled || !ant.active || !target.active || ant.isDead || target.isDead) return;
            performAttack(ant, target, false);
        }

        // ============================================================
        //  移动更新
        // ============================================================
        function updatePositions() {
            const margin = 50;
            const w = window.innerWidth, h = window.innerHeight;
            const now = Date.now();

            for (const inst of state.insects) {
                if (!inst.active || inst.isDead) continue;

                if (inst.isSummoned && state.fightEnabled) {
                    if (now - inst.lastAttackTime > ANT_ATTACK_COOLDOWN) {
                        let target = null;
                        let minDist = Infinity;
                        for (const other of state.insects) {
                            if (other.id === inst.id || other.isDead || !other.active || other.isSummoned) continue;
                            if (other.id === inst.summonerId) continue;
                            const d = dist(inst, other);
                            if (d < 60 && d < minDist) {
                                minDist = d;
                                target = other;
                            }
                        }
                        if (target) {
                            performSummonedAntAttack(inst, target);
                            inst.lastAttackTime = now;
                        }
                    }
                }

                if (inst.isPlayer) {
                    const jx = state.joystickDir.x;
                    const jy = state.joystickDir.y;
                    const speed = 2.8;
                    if (Math.abs(jx) > 0.05 || Math.abs(jy) > 0.05) {
                        const len = Math.sqrt(jx*jx + jy*jy);
                        inst.vx = (jx / len) * speed;
                        inst.vy = (jy / len) * speed;
                    } else {
                        inst.vx *= 0.92;
                        inst.vy *= 0.92;
                        if (Math.abs(inst.vx) < 0.05) inst.vx = 0;
                        if (Math.abs(inst.vy) < 0.05) inst.vy = 0;
                    }
                }

                inst.x += inst.vx;
                inst.y += inst.vy;
                const half = parseInt(inst.element.style.width) / 2 || 20;
                if (inst.x <= margin) { inst.x = margin; inst.vx *= -1; }
                if (inst.x >= w - margin - half*2) { inst.x = w - margin - half*2; inst.vx *= -1; }
                if (inst.y <= margin) { inst.y = margin; inst.vy *= -1; }
                if (inst.y >= h - margin - half*2) { inst.y = h - margin - half*2; inst.vy *= -1; }

                for (const other of state.insects) {
                    if (other.id === inst.id || !other.active || other.isDead) continue;
                    const dx = inst.x - other.x;
                    const dy = inst.y - other.y;
                    const d = Math.sqrt(dx*dx + dy*dy);
                    const minD = (inst.isSummoned || other.isSummoned) ? 25 : MIN_DIST * 0.7;
                    if (d < minD && d > 0.01) {
                        const angle = Math.atan2(dy, dx);
                        const push = (minD - d) * 0.04;
                        inst.vx += Math.cos(angle) * push;
                        inst.vy += Math.sin(angle) * push;
                        other.vx -= Math.cos(angle) * push;
                        other.vy -= Math.sin(angle) * push;
                    }
                }

                const speed = Math.sqrt(inst.vx*inst.vx + inst.vy*inst.vy);
                const maxSpeed = inst.isPlayer ? 3.0 : (inst.isSummoned ? 1.8 : 2.5);
                if (speed > maxSpeed) {
                    inst.vx = (inst.vx / speed) * maxSpeed;
                    inst.vy = (inst.vy / speed) * maxSpeed;
                }
                if (!inst.isPlayer && !inst.isSummoned && speed < 0.3 && Math.random() < 0.005) {
                    inst.vx += rand(-0.5, 0.5);
                    inst.vy += rand(-0.5, 0.5);
                }
                if (inst.isSummoned && speed < 0.1 && Math.random() < 0.01) {
                    inst.vx += rand(-0.2, 0.2);
                    inst.vy += rand(-0.2, 0.2);
                }

                inst.element.style.left = inst.x + 'px';
                inst.element.style.top = inst.y + 'px';
            }

            if (state.controlledInsect && state.controlledInsect.special === 'summon') {
                updateSummonCooldownUI();
            }

            requestAnimationFrame(updatePositions);
        }

        // ============================================================
        //  摇杆
        // ============================================================
        function setupJoystick() {
            let active = false;
            let touchId = null;
            const getPos = (e) => {
                const touch = e.touches ? e.touches[0] : e;
                return { x: touch.clientX, y: touch.clientY };
            };
            const handleStart = (e) => {
                e.preventDefault();
                const pos = getPos(e);
                const rect = joystickArea.getBoundingClientRect();
                const cx = rect.left + rect.width/2;
                const cy = rect.top + rect.height/2;
                const dx = pos.x - cx;
                const dy = pos.y - cy;
                const maxR = rect.width/2 - 20;
                const dist2 = Math.sqrt(dx*dx + dy*dy);
                const clampR = Math.min(dist2, maxR);
                const angle = Math.atan2(dy, dx);
                const moveX = Math.cos(angle) * clampR;
                const moveY = Math.sin(angle) * clampR;
                joystickKnob.style.transform = `translate(${-50 + (moveX/maxR)*50}%, ${-50 + (moveY/maxR)*50}%)`;
                state.joystickDir.x = moveX / maxR;
                state.joystickDir.y = moveY / maxR;
                active = true;
                if (e.touches) touchId = e.touches[0].identifier;
            };
            const handleMove = (e) => {
                e.preventDefault();
                if (!active) return;
                let pos;
                if (e.touches) {
                    let touch = null;
                    for (let t of e.touches) {
                        if (t.identifier === touchId) { touch = t; break; }
                    }
                    if (!touch) return;
                    pos = { x: touch.clientX, y: touch.clientY };
                } else {
                    pos = { x: e.clientX, y: e.clientY };
                }
                const rect = joystickArea.getBoundingClientRect();
                const cx = rect.left + rect.width/2;
                const cy = rect.top + rect.height/2;
                const dx = pos.x - cx;
                const dy = pos.y - cy;
                const maxR = rect.width/2 - 20;
                const dist2 = Math.sqrt(dx*dx + dy*dy);
                const clampR = Math.min(dist2, maxR);
                const angle = Math.atan2(dy, dx);
                const moveX = Math.cos(angle) * clampR;
                const moveY = Math.sin(angle) * clampR;
                joystickKnob.style.transform = `translate(${-50 + (moveX/maxR)*50}%, ${-50 + (moveY/maxR)*50}%)`;
                state.joystickDir.x = moveX / maxR;
                state.joystickDir.y = moveY / maxR;
            };
            const handleEnd = (e) => {
                active = false;
                touchId = null;
                joystickKnob.style.transform = 'translate(-50%, -50%)';
                state.joystickDir.x = 0;
                state.joystickDir.y = 0;
            };
            joystickArea.addEventListener('mousedown', handleStart);
            document.addEventListener('mousemove', handleMove);
            document.addEventListener('mouseup', handleEnd);
            joystickArea.addEventListener('touchstart', handleStart, { passive: false });
            document.addEventListener('touchmove', handleMove, { passive: false });
            document.addEventListener('touchend', handleEnd, { passive: false });
            document.addEventListener('touchcancel', handleEnd, { passive: false });
        }

        // ============================================================
        //  攻击按钮
        // ============================================================
        function setupAttackButtons() {
            attackMelee.addEventListener('click', () => {
                const inst = state.controlledInsect;
                if (!inst || inst.isDead || !inst.active) { showLog('❌ 没有可操控的昆虫', 1000); return; }
                if (!state.fightEnabled) { showLog('🔇 战斗已关闭', 800); return; }
                let target = null;
                let minDist = Infinity;
                for (const other of state.insects) {
                    if (other.id === inst.id || other.isDead || !other.active) continue;
                    const d = dist(inst, other);
                    if (d < MELEE_RANGE && d < minDist) {
                        minDist = d;
                        target = other;
                    }
                }
                if (!target) { showLog('⚔️ 附近没有敌人', 1000); return; }
                performAttack(inst, target, false);
            });
            attackRemote.addEventListener('click', () => {
                const inst = state.controlledInsect;
                if (!inst || inst.isDead || !inst.active) return;
                if (!state.fightEnabled) { showLog('🔇 战斗已关闭', 800); return; }
                performRangedAttack(inst);
            });
            attackPoison.addEventListener('click', () => {
                const inst = state.controlledInsect;
                if (!inst || inst.isDead || !inst.active) return;
                if (!state.fightEnabled) { showLog('🔇 战斗已关闭', 800); return; }
                performPoisonAttack(inst);
            });
            attackSummon.addEventListener('click', () => {
                const inst = state.controlledInsect;
                if (!inst || inst.isDead || !inst.active) return;
                if (!state.fightEnabled) { showLog('🔇 战斗已关闭', 800); return; }
                performSummon(inst);
            });
        }

        // ============================================================
        //  辅助函数
        // ============================================================
        function toggleFight(enabled) {
            state.fightEnabled = enabled;
            fightToggle.classList.toggle('active', enabled);
            if (!enabled) {
                deselectInsect();
                removeAllSummonedAnts();
                showLog('🔇 战斗已关闭，召唤物已消失', 1500);
            } else {
                showLog('⚔️ 战斗已开启', 1200);
            }
        }

        function showDamageNumber(inst, dmg) {
            const rect = inst.element.getBoundingClientRect();
            const span = document.createElement('div');
            span.className = 'dmg-float';
            span.textContent = '-' + dmg;
            span.style.left = (rect.left + rect.width/2 - 20) + 'px';
            span.style.top = (rect.top - 10) + 'px';
            body.appendChild(span);
            setTimeout(() => span.remove(), 1000);
        }

        function updateHpBar(inst) {
            const pct = Math.max(0, (inst.hp / inst.maxHp) * 100);
            inst.hpFill.style.width = pct + '%';
            const pct2 = inst.hp / inst.maxHp;
            inst.hpFill.className = 'hp-bar-fill';
            if (pct2 < 0.25) inst.hpFill.classList.add('low');
            else if (pct2 < 0.55) inst.hpFill.classList.add('mid');
        }

        function setDead(inst) {
            if (inst.isDead) return;
            inst.isDead = true;
            inst.element.classList.add('dead');
            inst.element.classList.remove('selected');
            inst.hpFill.style.width = '0%';
            inst.hpFill.className = 'hp-bar-fill';
            if (state.selectedId === inst.id) state.selectedId = null;
            if (state.controlledInsect && state.controlledInsect.id === inst.id) {
                stopControl();
            }
            if (inst.isSummoned) {
                if (inst.reviveTimer) clearInterval(inst.reviveTimer);
                setTimeout(() => {
                    if (inst.element && inst.element.parentNode) inst.element.parentNode.removeChild(inst.element);
                    state.insects = state.insects.filter(i => i.id !== inst.id);
                }, 1000);
                return;
            }
            inst.reviveCountdown = REVIVE_SECONDS;
            updateReviveTimer(inst);
            inst.reviveTimer = setInterval(() => {
                inst.reviveCountdown--;
                updateReviveTimer(inst);
                if (inst.reviveCountdown <= 0) {
                    clearInterval(inst.reviveTimer);
                    inst.reviveTimer = null;
                    reviveInsect(inst);
                }
            }, 1000);
        }

        function updateReviveTimer(inst) {
            if (inst.reviveTimerEl) inst.reviveTimerEl.textContent = `⏳ ${inst.reviveCountdown}s`;
        }
        function reviveInsect(inst) {
            if (inst.isSummoned) return;
            inst.isDead = false;
            inst.hp = inst.maxHp;
            inst.element.classList.remove('dead');
            inst.element.classList.add('revive');
            inst.hpFill.style.width = '100%';
            updateHpBar(inst);
            if (inst.reviveTimerEl) inst.reviveTimerEl.textContent = '';
            if (inst.reviveTimer) { clearInterval(inst.reviveTimer); inst.reviveTimer = null; }
            showLog(`✨ ${inst.name} 复活了！`, 1500);
            setTimeout(() => inst.element.classList.remove('revive'), 800);
        }

        function changeInsectSize(inst, newSize) {
            if (inst.size === newSize || inst.isSummoned) return;
            inst.size = newSize;
            const cfg = SIZE_CONFIG[newSize];
            inst.maxHp = Math.round(inst.baseHp * cfg.hpMult);
            inst.attack = Math.round(inst.baseAttack * cfg.atkMult);
            if (inst.hp > 0) inst.hp = Math.min(inst.hp, inst.maxHp);
            else inst.hp = 0;
            if (inst.isDead) inst.hp = 0;
            const sz = cfg.size;
            inst.element.style.width = sz + 'px';
            inst.element.style.height = sz + 'px';
            updateHpBar(inst);
            if (modalTargetId === inst.id) updateModalContent(inst);
            showLog(`📏 ${inst.name} 体型变为「${cfg.label}」`, 1200);
        }

        // ============================================================
        //  初始化
        // ============================================================
        function hideLoadingScreen() {
            if (loadingScreen) {
                loadingScreen.classList.add('hidden');
                setTimeout(() => { loadingScreen.style.display = 'none'; }, 800);
            }
        }

        function init() {
            hideLoadingScreen();

            // 创建预设昆虫
            INSECT_DATA.forEach((data, idx) => {
                setTimeout(() => createInsect(data, idx), idx * 180);
            });
            setTimeout(updatePositions, 1200);
            setupJoystick();
            setupAttackButtons();
            updateAddBtnState();

            // 加号按钮 - 上传图片
            addBtn.addEventListener('click', () => {
                if (customMetaList.length >= MAX_CUSTOM_INSECTS) {
                    showLog(`⚠️ 最多上传 ${MAX_CUSTOM_INSECTS} 只自定义昆虫`, 2000);
                    return;
                }
                fileInput.click();
            });

            fileInput.addEventListener('change', (e) => {
                if (e.target.files && e.target.files.length > 0) {
                    handleFileUpload(e.target.files[0]);
                }
                fileInput.value = '';
            });

            stopControlBtn.addEventListener('click', stopControl);

            settingsBtn.addEventListener('click', () => {
                fightToggle.classList.toggle('active', state.fightEnabled);
                settingsModal.classList.add('active');
            });
            settingsClose.addEventListener('click', () => settingsModal.classList.remove('active'));
            settingsDone.addEventListener('click', () => settingsModal.classList.remove('active'));
            settingsModal.addEventListener('click', (e) => { if (e.target === settingsModal) settingsModal.classList.remove('active'); });
            fightToggle.addEventListener('click', () => toggleFight(!state.fightEnabled));

            insectModalClose.addEventListener('click', closeInsectModal);
            modalCloseBtn.addEventListener('click', closeInsectModal);
            insectModal.addEventListener('click', (e) => { if (e.target === insectModal) closeInsectModal(); });

            sizeGroup.addEventListener('click', (e) => {
                const btn = e.target.closest('.size-btn');
                if (!btn) return;
                const size = btn.dataset.size;
                if (!SIZE_CONFIG[size]) return;
                const inst = state.insects.find(i => i.id === modalTargetId);
                if (!inst) return;
                changeInsectSize(inst, size);
                sizeGroup.querySelectorAll('.size-btn').forEach(b => b.classList.toggle('active', b.dataset.size === size));
                updateModalContent(inst);
            });

            controlToggleBtn.addEventListener('click', () => {
                const inst = state.insects.find(i => i.id === modalTargetId);
                if (!inst) return;
                toggleControl(inst);
            });

            listBtn.addEventListener('click', openListModal);
            listClose.addEventListener('click', () => listModal.classList.remove('active'));
            listModal.addEventListener('click', (e) => { if (e.target === listModal) listModal.classList.remove('active'); });
            listAllOff.addEventListener('click', () => {
                for (const key in state.insectTypeEnabled) state.insectTypeEnabled[key] = false;
                updateInsectVisibility();
                renderListModal();
                showLog('🚫 已关闭所有昆虫', 1500);
            });
            listAllOn.addEventListener('click', () => {
                for (const key in state.insectTypeEnabled) state.insectTypeEnabled[key] = true;
                updateInsectVisibility();
                renderListModal();
                showLog('✅ 已开启所有昆虫', 1500);
            });

            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    if (insectModal.classList.contains('active')) closeInsectModal();
                    if (settingsModal.classList.contains('active')) settingsModal.classList.remove('active');
                    if (listModal.classList.contains('active')) listModal.classList.remove('active');
                }
            });

            let resizeTimer;
            window.addEventListener('resize', () => {
                clearTimeout(resizeTimer);
                resizeTimer = setTimeout(() => {
                    const w = window.innerWidth, h = window.innerHeight;
                    for (const inst of state.insects) {
                        if (!inst.active) continue;
                        const half = parseInt(inst.element.style.width) / 2 || 20;
                        inst.x = clamp(inst.x, 30, w - 30 - half*2);
                        inst.y = clamp(inst.y, 30, h - 30 - half*2);
                        inst.element.style.left = inst.x + 'px';
                        inst.element.style.top = inst.y + 'px';
                    }
                }, 300);
            });

            document.addEventListener('click', (e) => {
                if (!e.target.closest('.insect') && !e.target.closest('.modal-overlay') && !e.target.closest('.settings-btn') && !e.target.closest('.list-btn') && !e.target.closest('#controls') && !e.target.closest('#stopControlBtn') && !e.target.closest('.add-btn')) {
                    deselectInsect();
                }
            });

            window.addEventListener('load', hideLoadingScreen);

            showLog('🌿 + 号上传自定义昆虫 · 长按修改属性 · 蚁后召唤小蚂蚁', 3000);
            console.log('🐞 昆虫对决 · 自定义版已启动！');
        }

        if (document.readyState === 'complete' || document.readyState === 'interactive') {
            init();
        } else {
            document.addEventListener('DOMContentLoaded', init);
        }
        setTimeout(() => {
            if (state.insects.length === 0) {
                init();
            }
        }, 500);
    </script>
</body>
</html>
